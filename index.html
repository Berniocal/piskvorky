<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Piškvorky – online + žebříček</title>
<meta name="theme-color" content="#0b1323" />
<style>
  :root{
    --bg:#0b1323; --bg2:#0f1722; --text:#e6eef8; --muted:#9fb0c7;
    --r:18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background: linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text);
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    user-select:none;
  }
  #app{
    width:100vw;height:100dvh;
    display:flex;flex-direction:column;
    padding: var(--safe-top) var(--safe-right) var(--safe-bot) var(--safe-left);
  }

  .screen{flex:1;display:none;position:relative;overflow:hidden;}
  .screen.active{display:flex;flex-direction:column;}

  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding: 18px;
    overflow:auto;
  }
  .card{
    border-radius: 22px;
    background: rgba(15,23,34,0.70);
    outline: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    padding: 14px;
  }

  .row2{
    display:grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items:center;
    padding: 8px 0;
  }
  .label{font-weight:900;opacity:.95}
  .hint{color: rgba(255,255,255,0.60); font-weight:700; font-size:12px; margin-top: 2px;}

  .inp{
    width:100%;
    height:46px;
    border-radius: 16px;
    border:0;
    background: rgba(0,0,0,0.22);
    outline: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.92);
    padding: 0 12px;
    font-weight: 900;
    letter-spacing: .2px;
  }

  .btn{
    width:100%;
    height:56px;
    border-radius: 18px;
    border:0;
    background: rgba(255,255,255,0.08);
    outline: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.92);
    font-weight: 950;
    font-size: 18px;
    text-align:left;
    padding: 0 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .btn:active{ transform: translateY(1px); opacity:.92 }
  .btn.primary{
    background: rgba(96,165,250,0.22);
    outline: 1px solid rgba(96,165,250,0.35);
  }
  .btn.good{
    background: rgba(34,197,94,0.18);
    outline: 1px solid rgba(34,197,94,0.28);
  }
  .btn.bad{
    background: rgba(239,68,68,0.16);
    outline: 1px solid rgba(239,68,68,0.26);
  }
  .btn[disabled]{opacity:.35}

  .pill{
    display:inline-flex;align-items:center;justify-content:center;
    height: 34px;padding: 0 10px;border-radius: 999px;
    background: rgba(0,0,0,0.22);
    outline: 1px solid rgba(255,255,255,0.10);
    font-weight: 900;
    letter-spacing: .2px;
    font-variant-numeric: tabular-nums;
  }
  .pill.green{ color: rgba(34,197,94,0.95); }
  .pill.red{ color: rgba(239,68,68,0.95); }

  /* HUD for game */
  .hud{
    position:absolute;
    top: calc(10px + var(--safe-top));
    left: calc(10px + var(--safe-left));
    right: calc(10px + var(--safe-right));
    display:flex;
    justify-content:space-between;
    gap:10px;
    z-index:5;
    pointer-events:none;
  }
  .hud .row{display:flex; gap:10px; pointer-events:auto; align-items:center;}
  .iconBtn{
    width: 46px;height: 46px;border-radius: 16px;border:0;
    background: rgba(0,0,0,0.28);
    outline: 1px solid rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    color: rgba(255,255,255,0.92);
    font-size: 20px;font-weight: 900;
  }
  .iconBtn:active{transform: translateY(1px); opacity:.9}
  .iconBtn[disabled]{opacity:.35}

  .turnBtn{
    width: 46px;height: 46px;border-radius: 999px;border:0;
    background: rgba(255,255,255,0.18);
    outline: 1px solid rgba(255,255,255,0.12);
    box-shadow: inset 0 0 0 4px rgba(0,0,0,0.25);
    pointer-events:auto;
  }
  .clockPill{
    min-width: 74px;height: 46px;padding: 0 12px;border-radius: 16px;
    display:flex;align-items:center;justify-content:center;
    font-weight: 950;letter-spacing: .3px;
    background: rgba(0,0,0,0.28);
    outline: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.92);
    font-variant-numeric: tabular-nums;
  }
  .clockPill.active{
    outline: 1px solid rgba(96,165,250,0.40);
    box-shadow: 0 0 0 2px rgba(96,165,250,0.10) inset;
  }
  canvas{width:100%;height:100%;display:block;}

  /* Bottom modal */
  #sheet{
    position:absolute; inset:0;
    display:none; align-items:flex-end; justify-content:center;
    z-index:30;
    background: rgba(0,0,0,0.35);
    padding: 18px;
  }
  #sheet.open{display:flex}
  .panel{
    width:min(560px, 96vw);
    border-radius: 22px;
    background: rgba(15,23,34,0.92);
    outline: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    padding: 12px;
  }
  .panelTitle{font-weight:950; opacity:.95; padding: 4px 6px 10px;}
  .panelRow{display:flex; gap:10px; align-items:center; padding: 6px;}
  .panelRow .inp{flex:1;}
  .tinyBtn{
    height:46px; min-width:46px;
    border-radius: 16px; border:0;
    background: rgba(255,255,255,0.08);
    outline: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.92);
    font-weight: 950;
    font-size: 18px;
    display:flex; align-items:center; justify-content:center;
  }

  /* Toast */
  .toast{
    position:absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(16px + var(--safe-bot));
    z-index: 40;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(0,0,0,0.40);
    outline: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.88);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .2px;
    display:none;
    white-space:nowrap;
    max-width:min(92vw,520px);
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toast.show{ display:block; }

  pre{
    white-space:pre-wrap;
    word-break:break-word;
    font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    color: rgba(255,255,255,0.78);
    margin-top: 8px;
  }

  /* ===== Board full width on mobile ===== */
  #scrGame .wrap{overflow:hidden}
  #gameBoardCard{flex:1; display:flex; flex-direction:column; padding:12px;}
  #boardWrap{flex:1; display:flex; align-items:center; justify-content:center; width:100%;}
  #board{display:block; border-radius:14px; background:#0b1220; touch-action:manipulation;}
  @media (max-width: 520px){
    #scrGame .wrap{padding:12px;}
  }

  /* ===== Win modal ===== */
  #winModal{
    display:none;
    position:fixed; inset:0;
    background: rgba(0,0,0,0.55);
    z-index:9999;
    align-items:center; justify-content:center;
    padding:16px;
  }
  #winModal.show{display:flex;}
  #winCard{
    width:min(520px,100%);
    background: rgba(15,23,34,0.92);
    outline: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  #winTitle{font-size:20px;font-weight:950;margin-bottom:6px;}
  #winText{opacity:.9;margin-bottom:12px;}
  #winBtns{display:flex;gap:10px;}
  #winBtns button{flex:1;}
  #rematchWait{margin-top:10px;opacity:.85;display:none;}

</style>
</head>

<body>

  <!-- SCREEN: NICK -->
  <div id="scrNick" class="screen">
    <div class="wrap">
      <div class="card">
        <h1>Piškvorky</h1>
        <div class="hint">Zadej přezdívku (nick)</div>
        <input id="inNick" autocomplete="nickname" placeholder="např. Jenda" />
        <div class="row">
          <button id="btnNickOk" class="btn primary"><span>Pokračovat</span><span>→</span></button>
          <button id="btnAltLogin" class="btn"><span>Jiný účet</span><span>👤</span></button>
        </div>
      </div>
    </div>
    <div id="toast1" class="toast"></div>
  </div>

  <!-- SCREEN: CODE -->
  <div id="scrCode" class="screen hidden">
    <div class="wrap">
      <div class="card">
        <div class="label">Tvůj kód</div>
        <div class="hint">Pošli soupeři kód pro spárování.</div>
        <div class="row2" style="align-items:center;">
          <div class="pill" id="myCodePill">—</div>
          <button id="btnCopyCode" class="iconBtn" title="Kopírovat">⧉</button>
        </div>
        <div class="hint" id="codeExplain">—</div>
        <button id="btnGoMenu" class="btn primary"><span>Pokračovat</span><span>→</span></button>
      </div>
    </div>
    <div id="toast2" class="toast"></div>
  </div>

  <!-- SCREEN: MENU -->
  <div id="scrMenu" class="screen hidden">
    <div class="wrap">
      <div class="card">
        <div class="row2">
          <div>
            <div class="label" id="meLabel">—</div>
            <div class="hint">Piškvorky (X/O), 15×15, 5 v řadě</div>
          </div>
          <button id="btnLogout" class="iconBtn" title="Odhlásit">⟵</button>
        </div>
        <div style="display:flex;gap:10px;align-items:center;justify-content:space-between;">
          <span class="pill" id="meRating">ELO —</span>
          <span class="pill" id="meDelta24">±0</span>
          <span class="pill" id="meTodayPairs">Dnes</span>
        </div>
      </div>

      <button id="btnLocal" class="btn"><span>Trénink (na telefonu)</span><span>🎯</span></button>
      <button id="btnOnlineTrain" class="btn"><span>Online trénink</span><span>🔗</span></button>
      <button id="btnRanked" class="btn primary"><span>Bodovaná hra</span><span>🏆</span></button>
      <button id="btnLadder" class="btn"><span>Žebříček</span><span>📈</span></button>

      <div class="card">
        <div class="hint" id="menuHint">—</div>
      </div>
    </div>
    <div id="toast3" class="toast"></div>
  </div>

    <!-- SCREEN: GAME -->
  <div id="scrGame" class="screen hidden">
    <div class="wrap" style="gap:12px;display:flex;flex-direction:column;">
      <div class="card" id="gameTopCard">
        <div class="row2">
          <button id="btnBack" class="iconBtn" title="Zpět">⟵</button>
          <div style="display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;">
            <span class="pill" id="clockA">—</span>
            <span class="pill" id="clockB">—</span>
            <button id="btnTurn" class="iconBtn" title="Konec tahu">⏱</button>
            <button id="btnSwap" class="iconBtn" title="Swap (povoleno jen někdy)">⇄</button>
            <button id="btnResign" class="iconBtn" title="Vzdát">🏳️</button>
          </div>
        </div>
      </div>

      <div class="card" id="gameBoardCard">
        <div id="boardWrap">
          <canvas id="board"></canvas>
        </div>
      </div>
    </div>
    <div id="toast5" class="toast"></div>
  </div>

  <!-- SCREEN: LADDER -->
  <div id="scrLadder" class="screen hidden">
    <div class="wrap">
      <div class="card">
        <div class="row2">
          <div>
            <div class="label">Žebříček</div>
            <div class="hint">Nick | rating | změna za 24h</div>
          </div>
          <div style="display:flex;gap:10px;">
            <button id="btnLadRefresh" class="iconBtn" title="Obnovit">↻</button>
            <button id="btnLadBack" class="iconBtn" title="Zpět">⟵</button>
          </div>
        </div>
        <pre id="ladderPre">Načítám…</pre>
      </div>
    </div>
    <div id="toast4" class="toast"></div>
  </div>

  <!-- Bottom sheet / modal -->
  <div id="sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheetCard">
      <div class="sheetHead">
        <div class="sheetTitle" id="sheetTitle">—</div>
        <button class="iconBtn" id="trClose" title="Zavřít">✕</button>
      </div>
      <div class="sheetBody" id="sheetBody"></div>
    </div>
  </div>


  <!-- Win / Rematch modal -->
  <div id="winModal" aria-hidden="true">
    <div id="winCard">
      <div id="winTitle">—</div>
      <div id="winText">—</div>
      <div id="winBtns">
        <button id="btnRematchYes" class="btn good"><span>Odveta</span><span>✅</span></button>
        <button id="btnRematchNo" class="btn bad"><span>Zpět do menu</span><span>❌</span></button>
      </div>
      <div id="rematchWait"></div>
    </div>
  </div>

<script type="module">
/* ============================================================
   Firebase
============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
import {
  getAuth, signInAnonymously, signOut
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, runTransaction,
  collection, query, orderBy, limit, getDocs,
  serverTimestamp, onSnapshot, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

/* ======== TVŮJ FIREBASE CONFIG ======== */
const firebaseConfig = {
  apiKey: "AIzaSyB9cERfEFvfp9BNXZoyB1H96Ji_qvHgBTc",
  authDomain: "piskvorky-web.firebaseapp.com",
  projectId: "piskvorky-web",
  storageBucket: "piskvorky-web.firebasestorage.app",
  messagingSenderId: "880043390902",
  appId: "1:880043390902:web:ddf6db7a184e15c4d3b317",
  measurementId: "G-D52KCD9J8S"
};
/* ====================================== */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ============================================================
   UI
============================================================ */
const $ = (s)=>document.querySelector(s);

const scrNick = $("#scrNick");
const scrCode = $("#scrCode");
const scrMenu = $("#scrMenu");
const scrLadder = $("#scrLadder");
const scrGame = $("#scrGame");

const toast1 = $("#toast1");
const toast2 = $("#toast2");
const toast3 = $("#toast3");
const toast4 = $("#toast4");
const toast5 = $("#toast5");

const inNick = $("#inNick");
const btnNickOk = $("#btnNickOk");
const btnAltLogin = $("#btnAltLogin");

const myCodePill = $("#myCodePill");
const btnCopyCode = $("#btnCopyCode");
const btnGoMenu = $("#btnGoMenu");
const codeExplain = $("#codeExplain");

const meLabel = $("#meLabel");
const meRating = $("#meRating");
const meDelta24 = $("#meDelta24");
const meTodayPairs = $("#meTodayPairs");
const btnLogout = $("#btnLogout");
const menuHint = $("#menuHint");

const btnLocal = $("#btnLocal");
const btnOnlineTrain = $("#btnOnlineTrain");
const btnRanked = $("#btnRanked");
const btnLadder = $("#btnLadder");

const ladderPre = $("#ladderPre");
const btnLadRefresh = $("#btnLadRefresh");
const btnLadBack = $("#btnLadBack");

const btnBack = $("#btnBack");
const btnResign = $("#btnResign");
const btnSwap = $("#btnSwap");
const btnTurn = $("#btnTurn");
const clockA = $("#clockA");
const clockB = $("#clockB");

const board = $("#board");
const ctx = board.getContext("2d");

const sheet = $("#sheet");
const sheetTitle = $("#sheetTitle");
const sheetBody = $("#sheetBody");

function showToast(el, msg, ms=1300){
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(()=> el.classList.remove("show"), ms);
}
function showScreen(el){
  [scrNick,scrCode,scrMenu,scrLadder,scrGame].forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
}
function vib(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms);}catch(e){} }

function normalizeNick(n){
  return (n||"").trim().replace(/\s+/g,"").slice(0,20);
}
function randomUserCode5(){
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out="";
  for(let i=0;i<5;i++) out += alphabet[Math.floor(Math.random()*alphabet.length)];
  return out;
}
function randomRoomCode5(){
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out="";
  for(let i=0;i<5;i++) out += alphabet[Math.floor(Math.random()*alphabet.length)];
  return out;
}
function hashLite(s){
  s = String(s||"");
  let h=2166136261;
  for(let i=0;i<s.length;i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h>>>0).toString(16).toUpperCase();
}
function dayKeyLocal(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}${m}${dd}`;
}
function pairKey(u1,u2){
  const a = [u1,u2].sort();
  return `${dayKeyLocal()}_${a[0]}_${a[1]}`;
}

function openSheet(title, bodyHtml){
  sheetTitle.textContent = title;
  sheetBody.innerHTML = bodyHtml;
  sheet.classList.add("open");
  sheet.setAttribute("aria-hidden","false");
}
function closeSheet(){
  sheet.classList.remove("open");
  sheet.setAttribute("aria-hidden","true");
  sheetBody.innerHTML = "";
}

/* ============================================================
   Win modal + rematch
============================================================ */
const winModal = $("#winModal");
const winTitle = $("#winTitle");
const winText = $("#winText");
const btnRematchYes = $("#btnRematchYes");
const btnRematchNo  = $("#btnRematchNo");
const rematchWait = $("#rematchWait");

function showWinModal(title, text){
  winTitle.textContent = title;
  winText.textContent = text || "";
  rematchWait.style.display = "none";
  winModal.classList.add("show");
  winModal.setAttribute("aria-hidden","false");
}
function setRematchWaiting(msg){
  rematchWait.style.display = "block";
  rematchWait.textContent = msg;
}
function hideWinModal(){
  winModal.classList.remove("show");
  winModal.setAttribute("aria-hidden","true");
}
sheet.addEventListener("pointerdown",(e)=>{ if(e.target===sheet) closeSheet(); });

function invertBoardXO(s){
  let out = "";
  for(let i=0;i<s.length;i++){
    const c = s[i];
    out += (c==="X") ? "O" : (c==="O") ? "X" : c;
  }
  return out;
}

/* ============================================================
   Touch preview (long press -> šedý náhled)
============================================================ */
let touchPreview = {
  active: false,
  x: -1,
  y: -1,
  timer: null
};

/* ============================================================
   Auth + account
============================================================ */
let authUid = null;
let accountId = null;
let me = null;
let unsubMe = null;

async function ensureAnon(){
  if(auth.currentUser) return auth.currentUser;
  const {user} = await signInAnonymously(auth);
  return user;
}

function setMeUI(){
  if(!me) return;
  meLabel.textContent = `@${me.nick}`;
  meRating.textContent = `ELO ${me.rating ?? 1000}`;

  const d = me.delta24 ?? 0;
  meDelta24.textContent = (d>=0? `+${d}` : `${d}`);
  meDelta24.classList.toggle("green", d>0);
  meDelta24.classList.toggle("red", d<0);

  meTodayPairs.textContent = `Dnes: ${me.ratedToday ?? 0}`;
}

async function loadMe(){
  if(!accountId) return;
  const snap = await getDoc(doc(db,"users",accountId));
  me = snap.exists() ? snap.data() : null;
}

function watchMe(){
  if(unsubMe) unsubMe();
  unsubMe = onSnapshot(doc(db,"users",accountId),(snap)=>{
    if(!snap.exists()) return;
    me = snap.data();
    if(scrMenu.classList.contains("active")) setMeUI();
  });
}

async function logoutAll(){
  try{ if(unsubMe) unsubMe(); }catch(e){}
  unsubMe=null; me=null; accountId=null;
  localStorage.removeItem("pisk_accountId");
  localStorage.removeItem("pisk_nick");
  localStorage.removeItem("pisk_userCode");
  try{ await signOut(auth); }catch(e){}
  showScreen(scrNick);
}

/* ============================================================
   First-run nickname -> create account
============================================================ */
async function createAccountWithNick(nick){
  nick = normalizeNick(nick);
  if(nick.length < 2){ showToast(toast1,"Krátká přezdívka"); return; }

  const user = await ensureAnon();
  authUid = user.uid;

  const nickLower = nick.toLowerCase();
  const userCode = randomUserCode5();
  const codeHash = hashLite(userCode);

  const accRef = doc(collection(db,"users"));
  const newAccountId = accRef.id;

  try{
    await runTransaction(db, async (tx)=>{
      const nickRef = doc(db,"nicks",nickLower);
      const nickSnap = await tx.get(nickRef);
      if(nickSnap.exists()) throw new Error("NICK_TAKEN");

      tx.set(nickRef, { accountId: newAccountId, createdAt: serverTimestamp() });

      tx.set(accRef, {
        nick, nickLower,
        codeHash,
        rating: 1000,
        delta24: 0,
        ratedToday: 0,
        createdAt: serverTimestamp(),
        lastSeenAt: serverTimestamp()
      }, {merge:false});
    });

    accountId = newAccountId;
    localStorage.setItem("pisk_accountId", accountId);
    localStorage.setItem("pisk_nick", nick);
    localStorage.setItem("pisk_userCode", userCode);

    myCodePill.textContent = userCode;
    codeExplain.textContent =

/* Alternate login with nick + code */
async function loginWithNickAndCode(){
  const nick = normalizeNick(prompt("Přezdívka:") || "");
  if(!nick){ return; }
  const code = (prompt("Tvůj 5místný kód:") || "").trim().toUpperCase();
  if(code.length < 5){ showToast(toast1,"Chybí kód"); return; }

  await ensureAnon();

  const nickLower = nick.toLowerCase();
  const nickRef = doc(db,"nicks",nickLower);
  const nickSnap = await getDoc(nickRef);
  if(!nickSnap.exists()){ showToast(toast1,"Neexistuje"); return; }

  const accId = nickSnap.data().accountId;
  const userSnap = await getDoc(doc(db,"users",accId));
  if(!userSnap.exists()){ showToast(toast1,"Chyba účtu"); return; }

  const data = userSnap.data();
  if((data.codeHash||"") !== hashLite(code)){
    showToast(toast1,"Špatný kód"); return;
  }

  accountId = accId;
  localStorage.setItem("pisk_accountId", accountId);
  localStorage.setItem("pisk_nick", nick);
  localStorage.setItem("pisk_userCode", code);

  await loadMe();
  watchMe();
  setMeUI();
  watchMatchInbox();
  showScreen(scrMenu);
}

/* ============================================================
   Board game core (15x15, 5 in row)
============================================================ */
const N = 15;
const WIN = 5;

function resizeCanvasToScreen(){
  const dpr = window.devicePixelRatio || 1;
  const wrap = $("#boardWrap");
  const size = Math.max(240, Math.floor(Math.min(wrap.clientWidth || 0, wrap.clientHeight || 0)));
  // CSS size
  board.style.width = size + "px";
  board.style.height = size + "px";
  // actual backing store
  board.width = Math.floor(size * dpr);
  board.height = Math.floor(size * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function clear(){
  const w = board.getBoundingClientRect().width;
  const h = board.getBoundingClientRect().height;
  ctx.clearRect(0,0,w,h);
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"rgba(255,255,255,0.03)");
  g.addColorStop(1,"rgba(0,0,0,0.20)");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);
}
function drawRoundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function getSquareArea(){
  const W = board.getBoundingClientRect().width;
  const H = board.getBoundingClientRect().height;
  const pad = 12;
  const size = Math.floor(Math.min(W, H) - pad*2);
  const ox = Math.floor((W - size)/2);
  const oy = Math.floor((H - size)/2);
  return {W,H,size,ox,oy};
}
function canvasPos(e){
  const r = board.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}
function getCellFromPoint(px, py){
  const {size, ox, oy} = getSquareArea();
  if(px < ox || px > ox + size || py < oy || py > oy + size) return null;
  const cell = size / N;
  const x = Math.floor((px - ox) / cell);
  const y = Math.floor((py - oy) / cell);
  if(x < 0 || y < 0 || x >= N || y >= N) return null;
  return {x, y};
}
function fmt(ms){
  ms = Math.max(0, ms|0);
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const ss = s%60;
  return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}
function setTurnColor(c){ btnTurn.style.background = c; }

function checkWinFrom(boardStr, x, y, ch){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  const inside = (a,b)=> a>=0 && a<N && b>=0 && b<N;
  const idx = (a,b)=> b*N+a;

  for(const [dx,dy] of dirs){
    let cnt=1;
    for(let s=1;s<WIN;s++){
      const nx=x+dx*s, ny=y+dy*s;
      if(inside(nx,ny) && boardStr[idx(nx,ny)]===ch) cnt++; else break;
    }
    for(let s=1;s<WIN;s++){
      const nx=x-dx*s, ny=y-dy*s;
      if(inside(nx,ny) && boardStr[idx(nx,ny)]===ch) cnt++; else break;
    }
    if(cnt>=WIN) return true;
  }
  return false;
}

function drawPreviewCell(x, y){
  if(x < 0 || y < 0) return;
  const {size, ox, oy} = getSquareArea();
  const cell = size / N;
  ctx.save();
  ctx.fillStyle = "rgba(180,180,180,0.35)";
  ctx.fillRect(ox + x*cell, oy + y*cell, cell, cell);
  ctx.restore();
}

function renderBoard(boardStr){
  resizeCanvasToScreen();
  clear();
  const {size,ox,oy} = getSquareArea();

  ctx.fillStyle="rgba(255,255,255,0.04)";
  drawRoundedRect(ox,oy,size,size,18); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,0.10)"; ctx.lineWidth=2; ctx.stroke();

  const cell=size/N;
  ctx.strokeStyle="rgba(255,255,255,0.10)";
  ctx.lineWidth=1.5;
  for(let i=0;i<=N;i++){
    ctx.beginPath(); ctx.moveTo(ox+i*cell,oy); ctx.lineTo(ox+i*cell,oy+size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox,oy+i*cell); ctx.lineTo(ox+size,oy+i*cell); ctx.stroke();
  }

  for(let y=0;y<N;y++){
    for(let x=0;x<N;x++){
      const ch = boardStr[y*N+x];
      if(ch===".") continue;
      const cx=ox+x*cell+cell/2;
      const cy=oy+y*cell+cell/2;
      const r=cell*0.32;
      ctx.lineWidth=Math.max(3, cell*0.08);

      if(ch==="X"){
        ctx.strokeStyle="rgba(0,0,0,0.86)";
        ctx.beginPath(); ctx.moveTo(cx-r,cy-r); ctx.lineTo(cx+r,cy+r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx+r,cy-r); ctx.lineTo(cx-r,cy+r); ctx.stroke();
      }else{
        ctx.strokeStyle="rgba(255,255,255,0.92)";
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
      }
    }
  }

  if(touchPreview.active){
    drawPreviewCell(touchPreview.x, touchPreview.y);
  }
}

/* ============================================================
   Game modes & online state
============================================================ */
let mode = null; // "local" | "trainOnline" | "ranked"
let local = null;

let gameId = null;
let game = null;
let unsubGame = null;

let tickTimer = null;

function stopTick(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }

function getDisplayedTimeLeft(g){
  const tl = (g.timeLeft || [600000,600000]).slice();
  const turn = g.turnPerson ?? 0;

  if(g.status === "active" && g.turnStartedAt){
    const startedMs = g.turnStartedAt.toMillis ? g.turnStartedAt.toMillis() : Date.now();
    const elapsed = Math.max(0, Date.now() - startedMs);
    tl[turn] = Math.max(0, tl[turn] - elapsed);
  }
  return tl;
}

function startTick(){
  stopTick();
  tickTimer = setInterval(()=> {
    if(!game) return;

    const turn = game.turnPerson ?? 0;
    const tl = getDisplayedTimeLeft(game);

    clockA.textContent = fmt(tl[0]);
    clockB.textContent = fmt(tl[1]);
    clockA.classList.toggle("active", turn===0 && game.status==="active");
    clockB.classList.toggle("active", turn===1 && game.status==="active");

    if(game.status==="active" && tl[turn] <= 0){
      showToast(toast5, "Prohra na čas", 900);
    }
  }, 200);
}

let localTick = null;
function stopLocalTick(){ if(localTick){ clearInterval(localTick); localTick=null; } }
function startLocalTick(){
  stopLocalTick();
  localTick = setInterval(()=>{
    if(mode!=="local" || !local || local.over) return;

    const tl = local.timeLeft.slice();
    const p = local.turnPerson;
    const elapsed = Math.max(0, Date.now() - local.turnStartMs);
    tl[p] = Math.max(0, tl[p] - elapsed);

    clockA.textContent = fmt(tl[0]);
    clockB.textContent = fmt(tl[1]);
    clockA.classList.toggle("active", p===0);
    clockB.classList.toggle("active", p===1);
  }, 200);
}

function myPersonIndex(g){
  if(!g) return null;
  if(g.p1?.accountId === accountId) return 0;
  if(g.p2?.accountId === accountId) return 1;
  return null;
}

function updateSwapButtonVisibility(){
  btnSwap.style.display = "none";

  if(mode === "local"){
    if(local?.swapAvailable && local?.turnPerson === 1 && !local?.over){
      btnSwap.style.display = "";
    }
    return;
  }

  if(!game || game.status !== "active") return;

  const myIdx = myPersonIndex(game);
  if(myIdx === null) return;

  if(game.swapAvailable === true && (game.moveCount ?? 0) === 1 && (game.turnPerson ?? 0) === myIdx){
    btnSwap.style.display = "";
  }
}

function setHUDFromGame(g){
  const turn = g.turnPerson ?? 0;
  const tl = getDisplayedTimeLeft(g);

  clockA.textContent = fmt((tl?.[0] ?? 600000));
  clockB.textContent = fmt((tl?.[1] ?? 600000));
  clockA.classList.toggle("active", turn===0 && g.status==="active");
  clockB.classList.toggle("active", turn===1 && g.status==="active");

  const whoIsX = g.xPerson ?? 0;
  const turnChar = (turn===whoIsX) ? "X" : "O";
  setTurnColor(turnChar==="X" ? "rgba(0,0,0,0.86)" : "rgba(255,255,255,0.92)");

  updateSwapButtonVisibility();
}

function cleanGameSubs(){
  if(unsubGame){ try{ unsubGame(); }catch(e){} unsubGame=null; }
  stopTick();
}

async function openGameById(id){
  cleanGameSubs();
  gameId = id;
  showScreen(scrGame);

  unsubGame = onSnapshot(doc(db,"games",gameId),(snap)=>{
    if(!snap.exists()) return;
    game = snap.data();
    if(!game.board) game.board = ".".repeat(N*N);

    // nastav mode podle hry (jen aby UI/Swap fungoval konzistentně)
    if(game.mode === "ranked") mode = "ranked";
  watchMatchInbox();
    if (game.mode === "trainOnline") mode = "trainOnline";

    renderBoard(game.board);
    setHUDFromGame(game);
    startTick();

    // === Ended -> show result + rematch ===
    if(game.status === "ended"){
      const myIdx = myPersonIndex(game);
      if(myIdx !== null){
        const winner = game.winnerPerson;
        const reason = game.endReason || "win";
        if(winner === myIdx){
          showWinModal("Vyhrál jsi 🏆", reason==="resign" ? "Soupeř to vzdal." : "Gratulace! Chceš odvetu?");
        }else{
          showWinModal("Prohrál jsi 😅", reason==="resign" ? "Vzdal jsi to." : "Chceš odvetu?");
        }

        // rematch flow
        const want = game.rematchWant || {};
        const p1 = game.p1?.accountId;
        const p2 = game.p2?.accountId;

        // někdo odmítl => oba zpět do menu (u toho kdo odmítl hned)
        if((p1 && want[p1]===false) || (p2 && want[p2]===false)){
          hideWinModal();
          leaveGame();
          return;
        }

        // pokud já už dal ANO, ukaž čekání
        if(want[accountId]===true){
          setRematchWaiting("Čekám na soupeře…");
        }

        // oba ANO -> vytvořit novou hru jen jedním klientem (p1)
        if(p1 && p2 && want[p1]===true && want[p2]===true){
          if(!game.rematchGameId){
            if(accountId === p1){
              try{
                const newRef = doc(collection(db,"games"));
                await setDoc(newRef,{
                  mode: game.mode || "trainOnline",
                  rated: !!game.rated,
                  status:"active",
                  createdAt: serverTimestamp(),
                  n:N, win:WIN,
                  board:".".repeat(N*N),
                  p1: game.p1,
                  p2: game.p2,
                  xPerson: 0,
                  turnPerson: 0,
                  timeLeft: [10*60*1000, 10*60*1000],
                  turnStartedAt: serverTimestamp(),
                  moveCount: 0,
                  swapAvailable: false,
                  lastAt: serverTimestamp()
                }, {merge:false});
                await updateDoc(doc(db,"games",gameId), { rematchGameId: newRef.id });
              }catch(e){ console.error(e); showToast(toast5,"Chyba odvety",900); }
            }else{
              setRematchWaiting("Zakládám odvetu…");
            }
          }else{
            hideWinModal();
            await openGameById(game.rematchGameId);
            return;
          }
        }
      }
    }else{
      hideWinModal();
    }
  });
}

async function leaveGame(){
  closeSheet();
  cleanGameSubs();
  stopLocalTick();
  gameId = null;
  game = null;
  mode = null;
  local = null;
  touchPreview.active = false;
  showScreen(scrMenu);
}

async function joinTrainingRoom(code){
  const roomRef = doc(db,"trainingRooms", code);
  try{
    const startedGameId = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(roomRef);
      if(!snap.exists()) throw new Error("NO");
      const r = snap.data();
      if(r.status !== "waiting") throw new Error("TAKEN");
      if(r.host?.accountId === accountId) throw new Error("SELF");

      const gRef = doc(collection(db,"games"));
      tx.set(gRef,{
        mode:"trainOnline",
        status:"active",
        createdAt: serverTimestamp(),
        n:N, win:WIN,
        board:".".repeat(N*N),

        p1: { accountId: r.host.accountId, nick: r.host.nick },
        p2: { accountId: accountId, nick: me.nick },

        xPerson: 0,
        turnPerson: 0,

        timeLeft: [10*60*1000, 10*60*1000],
        turnStartedAt: serverTimestamp(),
        moveCount: 0,
        swapAvailable: false,

        lastAt: serverTimestamp()
      });

      tx.update(roomRef,{
        status:"started",
        guest:{ accountId, nick: me.nick },
        gameId: gRef.id,
        startedAt: serverTimestamp()
      });

      return gRef.id;
    });

    closeSheet();
    await openGameById(startedGameId);
  }catch(e){
    const m = String(e.message||"");
    if(m.includes("NO")) showToast(toast5,"Kód neexistuje",900);
    else if(m.includes("TAKEN")) showToast(toast5,"Už běží",900);
    else if(m.includes("SELF")) showToast(toast5,"To jsi ty",900);
    else{ console.error(e); showToast(toast5,"Chyba",900); }
  }
}

/* ============================================================
   Ranked matchmaking
============================================================ */
let unsubQueueWatch = null;
let unsubInbox = null;

function watchMatchInbox(){
  if(unsubInbox){ try{unsubInbox();}catch(e){} unsubInbox=null; }
  if(!accountId) return;
  const offers = query(collection(db,"matchInbox", accountId, "offers"), orderBy("createdAt","asc"), limit(1));
  unsubInbox = onSnapshot(offers, async (snap)=>{
    if(snap.empty) return;
    const d = snap.docs[0];
    const offer = d.data() || {};
    const gid = offer.gameId;
    // consume offer
    try{ await deleteDoc(d.ref); }catch(e){}
    // leave queue if still there
    try{ await deleteDoc(doc(db,"rankedQueue", accountId)); }catch(e){}
    closeSheet();
    if(gid) await openGameById(gid);
  });
}

async function startRankedQueue(){
  closeSheet();
  mode = "ranked";

  const qRef = doc(db,"rankedQueue", accountId);
  await setDoc(qRef,{
    accountId,
    nick: me.nick,
    rating: me.rating ?? 1000,
    createdAt: serverTimestamp()
  }, {merge:true});

  openSheet("Bodovaná hra", `
    <div class="panelRow">
      <button class="btn primary" id="rankWait"><span>Čekám na soupeře…</span><span>⏳</span></button>
    </div>
    <div class="panelRow">
      <button class="btn bad" id="rankCancel"><span>Zrušit</span><span>✕</span></button>
    </div>
    <div class="hint" style="padding:0 6px;">Limit: max 2 hodnocené hry za den proti stejnému soupeři.</div>
  `);

  $("#rankWait").addEventListener("click", ()=> showToast(toast5,"Čekám…",900));
  $("#rankCancel").addEventListener("click", async ()=>{
    try{ await deleteDoc(qRef); }catch(e){}
    if(unsubQueueWatch){ try{ unsubQueueWatch(); }catch(e){} unsubQueueWatch=null; }
    closeSheet();
  });

  await tryMatchRanked();
}

async function tryMatchRanked(){
  const q = query(collection(db,"rankedQueue"), orderBy("createdAt","asc"), limit(15));
  const snap = await getDocs(q);

  const candidates = [];
  snap.forEach(d=>{
    if(d.id === accountId) return;
    candidates.push({ id:d.id, ...d.data() });
  });

  let chosen = null;
  for(const c of candidates){
    const pk = pairKey(accountId, c.id);
    const ps = await getDoc(doc(db,"pairDaily", pk));
    const count = ps.exists() ? (ps.data().count||0) : 0;
    if(count < 2){
      chosen = c;
      break;
    }
  }

  if(!chosen){
    if(!unsubQueueWatch){
      unsubQueueWatch = onSnapshot(collection(db,"rankedQueue"), async ()=>{
        await tryMatchRanked();
      });
    }
    return;
  }

  try{
    const gid = await runTransaction(db, async (tx)=>{
      const meQ = doc(db,"rankedQueue", accountId);
      const opQ = doc(db,"rankedQueue", chosen.id);

      const meSnap = await tx.get(meQ);
      const opSnap = await tx.get(opQ);
      if(!meSnap.exists() || !opSnap.exists()) throw new Error("QUEUE_CHANGED");

      const pk = pairKey(accountId, chosen.id);
      const pairRef = doc(db,"pairDaily", pk);
      const pairSnap = await tx.get(pairRef);
      const count = pairSnap.exists() ? (pairSnap.data().count||0) : 0;
      if(count >= 2) throw new Error("PAIR_LIMIT");

      const gRef = doc(collection(db,"games"));
      tx.set(gRef,{
        mode:"ranked",
        rated:true,
        status:"active",
        createdAt: serverTimestamp(),
        n:N, win:WIN,
        board:".".repeat(N*N),

        p1: { accountId: chosen.id, nick: chosen.nick },
        p2: { accountId: accountId, nick: me.nick },

        xPerson: 0,
        turnPerson: 0,

        timeLeft: [10*60*1000, 10*60*1000],
        turnStartedAt: serverTimestamp(),
        moveCount: 0,
        swapAvailable: false,

        lastAt: serverTimestamp()
      });

      // notify opponent
      const offerRef = doc(collection(db,"matchInbox", chosen.id, "offers"));
      tx.set(offerRef, { gameId: gRef.id, from: accountId, createdAt: serverTimestamp() });

      tx.set(pairRef, { count: count+1, updatedAt: serverTimestamp() }, {merge:true});
      tx.delete(meQ);
      tx.delete(opQ);

      return gRef.id;
    });

    if(unsubQueueWatch){ try{ unsubQueueWatch(); }catch(e){} unsubQueueWatch=null; }
    closeSheet();
    await openGameById(gid);

  }catch(e){
    const m = String(e.message||"");
    if(m.includes("PAIR_LIMIT")) await tryMatchRanked();
    else if(m.includes("QUEUE_CHANGED")) await tryMatchRanked();
    else{
      console.error(e);
      showToast(toast5,"Chyba párování",900);
    }
  }
}

/* ============================================================
   Moves (local + online)
============================================================ */
function setCharAt(s, idx, ch){
  return s.substring(0,idx) + ch + s.substring(idx+1);
}

async function placeAt(x,y){
  if(x<0||x>=N||y<0||y>=N) return;
  const idx = y*N+x;

  if(mode==="local"){
    if(local.over) return;
    if(local.board[idx] !== ".") return;

    const p = local.turnPerson;
    const elapsed = Math.max(0, Date.now() - local.turnStartMs);
    local.timeLeft[p] = Math.max(0, local.timeLeft[p] - elapsed);

    const ch = (p === local.xPerson) ? "X" : "O";

    local.board = setCharAt(local.board, idx, ch);
    local.moveCount++;
    vib(10);

    if(local.moveCount === 1) local.swapAvailable = true;
    else local.swapAvailable = false;

    renderBoard(local.board);

    if(checkWinFrom(local.board, x, y, ch)){
      local.over = true;
      showToast(toast5, `${ch} vyhrál`, 1200);
      updateSwapButtonVisibility();
      return;
    }

    local.turnPerson = 1 - local.turnPerson;
    local.turnStartMs = Date.now();

    const nextCh = (local.turnPerson === local.xPerson) ? "X" : "O";
    setTurnColor(nextCh==="X" ? "rgba(0,0,0,0.86)" : "rgba(255,255,255,0.92)");

    updateSwapButtonVisibility();
    return;
  }

  if(!gameId || !game) return;
  if(game.status !== "active") return;

  const myIdx = myPersonIndex(game);
  if(myIdx===null) return;
  if((game.turnPerson ?? 0) !== myIdx){
    showToast(toast5, "Teď ne", 700);
    return;
  }

  const boardStr = game.board || ".".repeat(N*N);
  if(boardStr[idx] !== ".") return;

  try{
    await runTransaction(db, async (tx)=>{
      const gRef = doc(db,"games",gameId);
      const snap = await tx.get(gRef);
      if(!snap.exists()) return;
      const g = snap.data();
      if(g.status !== "active") return;

      const myIdx2 = (g.p1.accountId===accountId)?0 : (g.p2.accountId===accountId)?1 : null;
      if(myIdx2===null) return;
      if((g.turnPerson??0) !== myIdx2) return;

      const b = g.board || ".".repeat(N*N);
      if(b[idx] !== ".") return;

      const tl = (g.timeLeft || [600000,600000]).slice();

      let elapsed = 0;
      if(g.turnStartedAt && g.turnStartedAt.toMillis){
        elapsed = Math.max(0, Date.now() - g.turnStartedAt.toMillis());
      }
      const cur = (g.turnPerson ?? 0);
      tl[cur] = Math.max(0, tl[cur] - elapsed);

      const xP = g.xPerson ?? 0;
      const ch2 = (myIdx2 === xP) ? "X" : "O";
      const nextB = setCharAt(b, idx, ch2);

      const winner = checkWinFrom(nextB, x, y, ch2) ? myIdx2 : null;
      const patch = {
        board: nextB,
        timeLeft: tl,
        lastAt: serverTimestamp(),
        moveCount: (g.moveCount ?? 0) + 1
      };

      if(patch.moveCount === 1) patch.swapAvailable = true;
      else patch.swapAvailable = false;

      if(winner!==null){
        patch.status = "ended";
        patch.winnerPerson = winner;
        patch.endedAt = serverTimestamp();
        patch.endReason = "win";
        patch.turnStartedAt = serverTimestamp();
      }else{
        patch.turnPerson = 1 - (g.turnPerson ?? 0);
        patch.turnStartedAt = serverTimestamp();
      }

      tx.update(gRef, patch);
      tx.set(doc(collection(gRef,"moves")), { x,y,ch:ch2, by: accountId, at: serverTimestamp() });
    });

    vib(10);

  }catch(e){
    console.error(e);
    showToast(toast5,"Chyba tahu",900);
  }
}

/* ============================================================
   Dotykové ovládání: tap vs long-press preview + drag
============================================================ */
board.addEventListener("pointerdown", (e)=>{
  if(sheet.classList.contains("open")) return;

  board.setPointerCapture(e.pointerId);

  const pos = canvasPos(e);
  const cell = getCellFromPoint(pos.x, pos.y);
  if(!cell) return;

  touchPreview.active = false;
  touchPreview.x = -1;
  touchPreview.y = -1;

  touchPreview.timer = setTimeout(()=>{
    touchPreview.active = true;
    touchPreview.x = cell.x;
    touchPreview.y = cell.y;
    renderBoard(mode==="local" ? local.board : (game?.board || ".".repeat(N*N)));
  }, 250);
});

board.addEventListener("pointermove", (e)=>{
  if(!touchPreview.active) return;

  const pos = canvasPos(e);
  const cell = getCellFromPoint(pos.x, pos.y);
  if(!cell) return;

  if(cell.x !== touchPreview.x || cell.y !== touchPreview.y){
    touchPreview.x = cell.x;
    touchPreview.y = cell.y;
    renderBoard(mode==="local" ? local.board : (game?.board || ".".repeat(N*N)));
  }
});

board.addEventListener("pointerup", (e)=>{
  clearTimeout(touchPreview.timer);

  const pos = canvasPos(e);
  const cell = getCellFromPoint(pos.x, pos.y);

  // dlouhý stisk -> potvrď náhled
  if(touchPreview.active){
    const x = touchPreview.x;
    const y = touchPreview.y;
    touchPreview.active = false;
    renderBoard(mode==="local" ? local.board : (game?.board || ".".repeat(N*N)));
    if(x>=0 && y>=0) placeAt(x,y);
    return;
  }

  // krátký tap
  if(cell){
    placeAt(cell.x, cell.y);
  }

  touchPreview.active = false;
});

board.addEventListener("pointercancel", ()=>{
  clearTimeout(touchPreview.timer);
  touchPreview.active = false;
});

/* ============================================================
   SWAP button behavior (local + online)
============================================================ */
btnSwap.addEventListener("click", async ()=>{
  if(mode === "local"){
    if(!local?.swapAvailable || local.turnPerson !== 1 || local.over) return;

    local.board = invertBoardXO(local.board);
    local.swapAvailable = false;
    local.xPerson = 1 - local.xPerson;

    local.turnPerson = 1;
    local.turnStartMs = Date.now();

    renderBoard(local.board);

    const turnCh = (local.turnPerson === local.xPerson) ? "X" : "O";
    setTurnColor(turnCh==="X" ? "rgba(0,0,0,0.86)" : "rgba(255,255,255,0.92)");
    updateSwapButtonVisibility();

    showToast(toast5, "SWAP!", 900);
    return;
  }

  if(!gameId || !game) return;
  if(game.status !== "active") return;

  const myIdx = myPersonIndex(game);
  if(myIdx === null) return;

  if(!(game.swapAvailable === true && (game.moveCount ?? 0) === 1 && (game.turnPerson ?? 0) === myIdx)){
    return;
  }

  try{
    await runTransaction(db, async (tx)=>{
      const gRef = doc(db,"games",gameId);
      const snap = await tx.get(gRef);
      if(!snap.exists()) return;
      const g = snap.data();
      if(g.status !== "active") return;

      const my = (g.p1.accountId===accountId)?0 : (g.p2.accountId===accountId)?1 : null;
      if(my === null) return;

      if(!(g.swapAvailable === true && (g.moveCount ?? 0) === 1 && (g.turnPerson ?? 0) === my)) return;

      const b = g.board || ".".repeat(N*N);

      tx.update(gRef,{
        board: invertBoardXO(b),
        xPerson: 1 - (g.xPerson ?? 0),
        swapAvailable: false,
        turnStartedAt: serverTimestamp(),
        lastAt: serverTimestamp()
      });
    });

    showToast(toast5, "SWAP!", 900);
  }catch(e){
    console.error(e);
    showToast(toast5, "SWAP chyba", 900);
  }
});

/* ============================================================
   Resign / Back
============================================================ */
btnResign.addEventListener("click", async ()=>{
  if(mode==="local"){
    showToast(toast5,"Konec",900);
    local.over=true;
    updateSwapButtonVisibility();
    return;
  }
  if(!gameId || !game) return;
  const myIdx = myPersonIndex(game);
  if(myIdx===null) return;

  try{
    await updateDoc(doc(db,"games",gameId),{
      status:"ended",
      winnerPerson: 1-myIdx,
      endedAt: serverTimestamp(),
      endReason:"resign"
    });
  }catch(e){
    console.error(e);
  }
});
btnBack.addEventListener("click", leaveGame);

btnRematchYes.addEventListener("click", async ()=>{
  if(!gameId || !game) return;
  try{
    await updateDoc(doc(db,"games",gameId), { [`rematchWant.${accountId}`]: true, rematchAt: serverTimestamp() });
    setRematchWaiting("Čekám na soupeře…");
  }catch(e){ console.error(e); showToast(toast5,"Chyba odvety",900); }
});
btnRematchNo.addEventListener("click", async ()=>{
  if(!gameId || !game) { hideWinModal(); leaveGame(); return; }
  try{
    await updateDoc(doc(db,"games",gameId), { [`rematchWant.${accountId}`]: false, rematchAt: serverTimestamp() });
  }catch(e){ /* ignore */ }
  hideWinModal();
  leaveGame();
});

async function refreshLadder(){
  ladderPre.textContent = "Načítám…";
  try{
    const q = query(collection(db,"users"), orderBy("rating","desc"), limit(100));
    const snap = await getDocs(q);

    let i=0;
    const lines = [];
    snap.forEach(d=>{
      i++;
      const u = d.data();
      const r = u.rating ?? 1000;
      const d24 = u.delta24 ?? 0;
      const tag = d24>0 ? `+${d24}` : `${d24}`;
      lines.push(`${String(i).padStart(2,"0")}. @${u.nick}   ${String(r).padStart(4," ")}   ${tag}`);
    });
    ladderPre.textContent = lines.length ? lines.join("\n") : "—";
  }catch(e){
    console.error(e);
    ladderPre.textContent = "Chyba";
  }
}

/* ============================================================
   Auto-restore
============================================================ */
async function boot(){
  await ensureAnon();

  const savedAcc = localStorage.getItem("pisk_accountId");
  if(savedAcc){
    accountId = savedAcc;
    await loadMe();
    if(me){
      watchMe();
      setMeUI();
      watchMatchInbox();
      showScreen(scrMenu);
      return;
    }else{
      localStorage.removeItem("pisk_accountId");
    }
  }
  showScreen(scrNick);
}
boot();

/* ===== Ensure board fills screen nicely ===== */
function resizeBoardCanvas(){
  // force a redraw when entering game
  if(mode==="local" && local) renderBoard(local.board);
  if(game && game.board) renderBoard(game.board);
}
window.addEventListener("orientationchange", ()=> setTimeout(resizeBoardCanvas, 120));


/* ============================================================
   Responsive redraw
============================================================ */
window.addEventListener("resize", ()=>{
  if(mode==="local" && local) renderBoard(local.board);
  if(game && game.board) renderBoard(game.board);
});
